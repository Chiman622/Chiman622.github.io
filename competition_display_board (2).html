<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Competition Information Board</title><style>:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#f8fafc;--muted:#94a3b8;--green:#22c55e;--yellow:#f59e0b;--red:#ef4444;--blue:#2563eb}*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,Arial,sans-serif}body{background:var(--bg);color:var(--text);padding:20px}.container{max-width:1800px;margin:auto}.header{text-align:center;margin-bottom:24px}.header h1{font-size:clamp(2rem,4vw,4rem);margin-bottom:10px}.events-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px}.event-header{display:flex;justify-content:space-between;flex-wrap:wrap}.status{display:inline-block;margin-top:8px;padding:8px 16px;border-radius:999px;font-weight:700}.status-progress{background:var(--green)}.status-preparation{background:var(--yellow);color:#000}.status-break{background:#64748b}.status-finished{background:var(--red)}.progress-bar{margin-top:18px;background:#334155;height:14px;border-radius:999px;overflow:hidden}.progress-fill{height:100%}.section-title{margin:20px 0 10px;color:#60a5fa}table{width:100%;border-collapse:collapse}th{background:#334155;padding:12px}td{padding:14px;text-align:center;border-bottom:1px solid #334155}.announcement{margin-top:20px;background:var(--blue);border-radius:16px;padding:20px;text-align:center}.footer{margin-top:20px;text-align:center;color:var(--muted)}@media(max-width:900px){.events-grid{grid-template-columns:1fr}}</style></head><body><div class="container"><div class="header"><h1>🏆 Competition Information Board</h1><div>32 Teams • 4 Groups • 8 Rounds</div></div><div class="events-grid"><div class="card"><div class="event-header"><h2>🏃 Event A</h2><div><div id="eventA-round">Round 0 / 8</div><div id="eventA-status" class="status status-preparation">Loading...</div></div></div><div class="progress-bar"><div id="eventA-progress" class="progress-fill" style="width:0%;background:#22c55e"></div></div><div id="eventA-percent">0%</div><div class="section-title">Current & Upcoming Teams</div><table><thead><tr><th>Group</th><th>Current</th><th>Next</th></tr></thead><tbody id="eventA-table"></tbody></table></div><div class="card"><div class="event-header"><h2>🎯 Event B</h2><div><div id="eventB-round">Round 0 / 8</div><div id="eventB-status" class="status status-preparation">Loading...</div></div></div><div class="progress-bar"><div id="eventB-progress" class="progress-fill" style="width:0%;background:#38bdf8"></div></div><div id="eventB-percent">0%</div><div class="section-title">Current & Upcoming Teams</div><table><thead><tr><th>Group</th><th>Current</th><th>Next</th></tr></thead><tbody id="eventB-table"></tbody></table></div></div><div id="announcement" class="announcement">📢 Loading announcement...</div><div id="lastUpdated" class="footer">Waiting for updates...</div></div><script>const API_URL='https://script.google.com/macros/s/AKfycbzRhRu3zzk7BIcMDV3k0d0BPWXMdoi7Rz2TARDNqlrW-jxVIQt_7iGaoPus0As-eJ9K/exec';const TOTAL_ROUNDS=8;function getStatusClass(s){s=(s||'').toLowerCase();if(s==='in progress')return 'status status-progress';if(s==='break')return 'status status-break';if(s==='finished')return 'status status-finished';return 'status status-preparation';}function render(idPrefix,event){const r=Number(event.round||0);const p=Math.min(100,r/TOTAL_ROUNDS*100);document.getElementById(idPrefix+'-round').innerHTML='Round '+r+' / '+TOTAL_ROUNDS;const status=document.getElementById(idPrefix+'-status');status.className=getStatusClass(event.status);status.innerHTML=event.status||'';document.getElementById(idPrefix+'-progress').style.width=p+'%';document.getElementById(idPrefix+'-percent').innerHTML=p.toFixed(1)+'% Complete';let html='';(event.teams||[]).forEach(t=>{html+=`<tr><td>${t.group}</td><td>${t.current}</td><td>${t.next}</td></tr>`});document.getElementById(idPrefix+'-table').innerHTML=html;}async function loadData(){try{const res=await fetch(API_URL+'?t='+Date.now());const data=await res.json();render('eventA',data.eventA);render('eventB',data.eventB);document.getElementById('announcement').innerHTML='📢 '+(data.announcement||'');document.getElementById('lastUpdated').innerHTML='Last Updated: '+new Date().toLocaleString();}catch(e){document.getElementById('lastUpdated').innerHTML='Connection Error';}}loadData();setInterval(loadData,5000);</script></body></html>
