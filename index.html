<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>St John Competition Board</title><style>:root{--bg:#111111;--card:#ffffff;--gold:#C8A64D;--text:#111111;--muted:#666666}*{box-sizing:border-box;font-family:Segoe UI,Arial,sans-serif}body{margin:0;background:var(--bg);padding:20px} .container{max-width:1800px;margin:auto}.header{background:var(--gold);color:#111;padding:20px;border-radius:18px;margin-bottom:20px;display:flex;align-items:center;justify-content:center;gap:20px}.logo{width:90px;height:90px;border:3px solid #111;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold}.title h1{margin:0}.events{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#fff;border:3px solid var(--gold);border-radius:18px;padding:20px}.status{display:inline-block;padding:6px 12px;border-radius:999px;background:var(--gold);color:#111;font-weight:bold}.bar{height:12px;background:#ddd;border-radius:999px;overflow:hidden}.fill{height:100%;background:var(--gold)}table{width:100%;border-collapse:collapse;margin-top:12px}th{background:var(--gold)}th,td{padding:10px;text-align:center;border-bottom:1px solid #ddd}.announcement{margin-top:20px;background:var(--gold);padding:15px;border-radius:12px;text-align:center;font-weight:bold}.footer{color:#fff;text-align:center;margin-top:15px}@media(max-width:900px){.events{grid-template-columns:1fr}.header{flex-direction:column}}</style></head><body><div class="container"><div class="header"><div class="logo">SJ</div><div class="title"><h1>Competition Information Board</h1><div>ST. JOHN COMPETITION</div></div></div><div class="events"><div class="card"><h2>Event A</h2><div id="eventA-round">Round 0 / 8</div><div id="eventA-status" class="status">Loading...</div><div class="bar"><div id="eventA-progress" class="fill" style="width:0%"></div></div><div id="eventA-percent">0%</div><table><thead><tr><th>Group</th><th>Current</th><th>Next</th></tr></thead><tbody id="eventA-table"></tbody></table></div><div class="card"><h2>Event B</h2><div id="eventB-round">Round 0 / 8</div><div id="eventB-status" class="status">Loading...</div><div class="bar"><div id="eventB-progress" class="fill" style="width:0%"></div></div><div id="eventB-percent">0%</div><table><thead><tr><th>Group</th><th>Current</th><th>Next</th></tr></thead><tbody id="eventB-table"></tbody></table></div></div><div id="announcement" class="announcement">Loading announcement...</div><div id="lastUpdated" class="footer">Waiting for updates...</div></div><script>const API_URL='https://script.google.com/macros/s/AKfycbzRhRu3zzk7BIcMDV3k0d0BPWXMdoi7Rz2TARDNqlrW-jxVIQt_7iGaoPus0As-eJ9K/exec';const TOTAL_ROUNDS=8;function render(prefix,e){let r=Number(e.round||0),p=Math.min(100,r/TOTAL_ROUNDS*100);document.getElementById(prefix+'-round').innerHTML='Round '+r+' / '+TOTAL_ROUNDS;document.getElementById(prefix+'-status').innerHTML=e.status||'';document.getElementById(prefix+'-progress').style.width=p+'%';document.getElementById(prefix+'-percent').innerHTML=p.toFixed(1)+'%';document.getElementById(prefix+'-table').innerHTML=(e.teams||[]).map(t=>`<tr><td>${t.group}</td><td>${t.current}</td><td>${t.next}</td></tr>`).join('');}async function loadData(){try{const r=await fetch(API_URL+'?t='+Date.now());const d=await r.json();render('eventA',d.eventA);render('eventB',d.eventB);announcement.innerHTML='📢 '+(d.announcement||'');lastUpdated.innerHTML='Last Updated: '+new Date().toLocaleString();}catch(e){lastUpdated.innerHTML='Connection Error';}}loadData();setInterval(loadData,5000);</script></body></html>
