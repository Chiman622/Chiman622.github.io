<!DOCTYPE html>
<html lang="zh-HK">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YNT IDC Announcement Board</title>

  <style>
    :root {

      --bg: #f4f7fb;
      --card: #ffffff;
      --border: #dbe4f0;

      --text: #1e293b;
      --muted: #64748b;

      --primary: #2563eb;

      --prep: #f59e0b;
      --progress: #dc2626;
      --ready: #2563eb;
      --finished: #16a34a;

    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {

      font-family:
        "Segoe UI",
        "Microsoft JhengHei",
        sans-serif;

      background: var(--bg);

      color: var(--text);

      padding: 20px;

    }

    .container {

      max-width: 1800px;

      margin: auto;

    }

    .header {

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 20px;

      margin-bottom: 20px;

    }

    h1 {

      font-size: 2.4rem;

      font-weight: 800;

    }

    .lang-switch {

      display: flex;

      gap: 8px;

    }

    .lang-switch button {

      border: none;

      background: white;

      border: 1px solid var(--border);

      padding: 10px 16px;

      border-radius: 10px;

      cursor: pointer;

      font-weight: 600;

    }

    .master-announcement {

      background: #2563eb;

      color: white;

      padding: 18px;

      border-radius: 18px;

      margin-bottom: 20px;

      font-size: 1.1rem;

      font-weight: 700;

      white-space: pre-line;

    }

    .events-container {

      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(350px, 1fr));

      gap: 20px;

    }

    .event-card {

      background: var(--card);

      border: 1px solid var(--border);

      border-radius: 20px;

      padding: 20px;

      box-shadow:
        0 2px 10px rgba(0, 0, 0, .08);

    }

    .event-title {

      font-size: 1.7rem;

      font-weight: 800;

    }

    .event-subtitle {

      color: var(--muted);

      margin-bottom: 16px;

    }
.event-summary{

  display:grid;

  grid-template-columns:
    repeat(auto-fit,minmax(180px,1fr));

  gap:12px;

  margin-bottom:20px;

}

.summary-card{

  border-radius:12px;

  padding:12px;

  color:white;

  font-weight:600;

  box-shadow:
    0 2px 6px rgba(0,0,0,.1);

}

.summary-card.preparation{

  background:#f59e0b;

}

.summary-card.ready{

  background:#2563eb;

}

.summary-card.inprogress{

  background:#dc2626;

}

.summary-card.finished{

  background:#16a34a;

}

.summary-title{

  font-size:16px;

  font-weight:700;

  margin-bottom:6px;

}

.summary-round{

  opacity:.95;

  font-size:14px;

}
    .round-info {

      font-weight: 700;

      margin-bottom: 12px;

    }

    .status {

      display: inline-block;

      color: white;

      padding: 8px 14px;

      border-radius: 999px;

      font-weight: 700;

    }

    .progress {

      margin-top: 14px;

      height: 14px;

      background: #dbe4f0;

      border-radius: 999px;

      overflow: hidden;

    }

    .progress-fill {

      height: 100%;

      width: 0%;

    }

    .progress-text {

      margin-top: 8px;

      font-weight: 600;

      color: var(--muted);

    }

    .event-announcement {
      margin-top: 10px;
      background: #eef4ff;
      border-left: 4px solid #2563eb;
      border-radius: 10px;
      padding: 8px 12px;
      display: inline-block;
      width: 100%;
    }

    .announcement-title {

      display: inline;

      font-weight: 700;

      color: #2563eb;

      font-size: 20px;

    }

    .announcement-content {

      display: inline;

      font-size: 20px;

      line-height: 1.3;

    }



    .divisions {

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 12px;

      margin-top: 16px;

    }

    .division-card {

      background: #f8fafc;

      border: 1px solid #e2e8f0;

      border-radius: 14px;

      padding: 14px;

      cursor: pointer;

      transition: .2s;

    }

    .division-card:hover {

      transform: translateY(-2px);

    }

    .group-title {

      color: var(--primary);

      font-weight: 800;

      margin-bottom: 12px;

    }

    .section-label {

      color: var(--muted);

      font-size: .85rem;

      margin-bottom: 4px;

    }

    .current-name {

      font-weight: 700;

    }

    .next-name {

      font-weight: 700;

      color: var(--primary);

    }

    .division-code {

      color: var(--muted);

      font-size: .9rem;

    }

    .arrow {

      margin: 4px 0;

      font-size: 1.4rem;

      color: var(--primary);

    }

    .no-schedule {

      margin-top: 20px;

      padding: 20px;

      border: 1px dashed #cbd5e1;

      border-radius: 12px;

      text-align: center;

      color: var(--muted);

    }

    .footer {

      text-align: center;

      color: var(--muted);

      margin-top: 20px;

    }

    .modal {

      display: none;

      position: fixed;

      inset: 0;

      background: rgba(0, 0, 0, .55);

      z-index: 9999;

      padding: 20px;

    }

    .modal.show {

      display: block;

    }

    .modal-content {

      background: white;

      max-width: 900px;

      margin: 20px auto;

      border-radius: 20px;

      padding: 24px;

      max-height: 90vh;

      overflow: auto;

    }

    .modal-header {

      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 16px;

    }

    .close-btn {

      border: none;

      background: #ef4444;

      color: white;

      width: 40px;

      height: 40px;

      border-radius: 10px;

      cursor: pointer;

      font-size: 1.2rem;

    }

    .schedule-announcement {

      display: flex;

      align-items: center;

      gap: 10px;

      background: #f8fbff;

      border: 1px solid #dbeafe;

      border-left: 4px solid #2563eb;

      border-radius: 10px;

      padding: 8px 12px;

      margin-bottom: 12px;

      font-size: 16px;

      line-height: 1.3;

    }

    .schedule-table {

      display: grid;

      gap: 10px;

    }

    .schedule-row {

      border: 1px solid #e5e7eb;

      border-radius: 10px;

      padding: 12px;

    }

    .schedule-row.current {

      border: 2px solid #2563eb;

      background: #eef4ff;

    }

    .schedule-row.next {

      border: 2px solid #f59e0b;

      background: #fff7ed;

    }

    .round-label {

      font-weight: 700;

      margin-bottom: 4px;

    }

    .badge {

      display: inline-block;

      margin-left: 10px;

      font-size: .8rem;

      padding: 4px 8px;

      border-radius: 999px;

      color: white;

    }

    .badge-current {

      background: #2563eb;

    }

    .badge-next {

      background: #f59e0b;

    }

    @media(max-width:900px) {

      .divisions {

        grid-template-columns: 1fr;

      }

      .events-container {

        grid-template-columns: 1fr;

      }

    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">

      <div>

        <h1 id="title">

          Loading...

        </h1>

        <div id="subtitle"></div>

      </div>

      <div class="lang-switch">

        <button onclick="setLang('zh')">
        中文
      </button>

        <button onclick="setLang('en')">
        EN
      </button>

      </div>

    </div>

    <div id="masterAnnouncement" class="master-announcement">

    </div>
    
<div
  id="eventSummary"
  class="event-summary">
</div>
    <div id="eventsContainer" class="events-container">

    </div>

    <div id="lastUpdated" class="footer">

    </div>

  </div>

  <div id="scheduleModal" class="modal">

    <div class="modal-content">

      <div class="modal-header">

        <h2 id="modalTitle">
        </h2>

        <button
              class="close-btn"
              onclick="closeModal()">

              ✕

          </button>

      </div>

      <div id="modalBody">

      </div>

    </div>

  </div>

  <script>
    const API_URL =
'https://script.google.com/macros/s/AKfycbydyLBjUxSf_GEQ7bjOtXtdKgS7l9ImunI2JSKgfxYRI9phTc7vCfnD0ZD3f-gds2Z6/exec';

let currentLanguage =
    localStorage.getItem(
        'language'
    ) || 'zh';

let boardData = null;

let lastJson = '';
const TXT = {

  zh:{

    current:'本輪',

    next:'下一輪',

    finalRound:

      '已完成最後一輪',

    progress:

      '完成進度',

    noSchedule:

      '尚未設定賽程',

    updated:

      '最後更新時間',

    eventAnnouncement:

      '活動公告',

    groupAnnouncement:

      '組別公告',

    currentBadge:

      '本輪',

    nextBadge:

      '下一輪'

  },

  en:{

    current:'Current Round',

    next:'Next Round',

    finalRound:

      'Final Round Completed',

    progress:

      'Progress',

    noSchedule:

      'Schedule Not Configured',

    updated:

      'Last Updated',

    eventAnnouncement:

      'Event Announcement',

    groupAnnouncement:

      'Group Announcement',

    currentBadge:

      'Current',

    nextBadge:

      'Next'

  }

};function setLang(lang){

  currentLanguage = lang;

  localStorage.setItem(
    'language',
    lang
  );

  if(boardData){

    render(boardData);

  }

}
function getStatusClass(status){

  switch(status){

    case 'Preparation':
      return 'preparation';

    case 'Ready':
      return 'ready';

    case 'In Progress':
      return 'inprogress';

    case 'Finished':
      return 'finished';

    default:
      return 'ready';

  }

}
function getStatusColor(status){

  switch(status){

    case 'Preparation':
      return 'var(--prep)';

    case 'Ready':
      return 'var(--ready)';

    case 'In Progress':
      return 'var(--progress)';

    case 'Finished':
      return 'var(--finished)';

    default:
      return '#64748b';

  }

}
function getStatusText(status){

  if(currentLanguage === 'zh'){

    switch(status){

      case 'Preparation':
        return '準備中';

      case 'Ready':
        return '就緒';

      case 'In Progress':
        return '進行中';

      case 'Finished':
        return '已完成';

      default:
        return status;

    }

  }

  return status;

}
async function loadData(){

  try{

    const res =
      await fetch(
        API_URL +
        '?t=' +
        Date.now()
      );

    const data =
      await res.json();

    const newJson =
  JSON.stringify(data);

if(newJson !== lastJson){

  lastJson = newJson;

  boardData = data;

  render(data);

}
  }
  catch(ex){

    console.error(ex);

    document
      .getElementById(
        'eventsContainer'
      )
      .innerHTML =

      `
      <div class="no-schedule">

      API Connection Error

      </div>
      `;

  }

}
function renderSummary(events){

  let html = '';

  events.forEach(event=>{

    html += `

      <div
        class="
          summary-card
          ${getStatusClass(event.status)}
        ">

        <div class="summary-title">

          ${
            currentLanguage === 'zh'
              ? event.nameZh
              : event.nameEn
          }

        </div>

        <div>

          ${getStatusText(event.status)}

        </div>

        <div class="summary-round">

          R${event.currentRound}
          /
          R${event.totalRounds}

        </div>

      </div>

    `;

  });

  document
    .getElementById(
      'eventSummary'
    )
    .innerHTML = html;

}
function render(data){

  document
    .getElementById(
      'title'
    )
    .innerText =

    currentLanguage === 'zh'

    ? data.competitionNameZh

    : data.competitionNameEn;

  document
    .getElementById(
      'masterAnnouncement'
    )
    .innerText =

    '📢 ' +

    (
      currentLanguage === 'zh'

      ? data.masterAnnouncementZh

      : data.masterAnnouncementEn
    );

renderSummary(
  data.events
);

renderEvents(
  data.events
);

  document
    .getElementById(
      'lastUpdated'
    )
    .innerText =

      TXT[
        currentLanguage
      ].updated

      + ' : '

      + new Date()
          .toLocaleString();

}

function renderEvents(events){

  let html = '';

  events.forEach(event=>{

    const percent =

      (
        event.currentRound
        / event.totalRounds
      ) * 100;

    html += `

      <div class="event-card">

        <div class="event-title">

          ${
            currentLanguage === 'zh'
              ? event.nameZh
              : event.nameEn
          }

        </div>

        <div class="event-subtitle">

          ${
            currentLanguage === 'zh'
            ? event.nameEn
            : event.nameZh
          }

        </div>

        <div class="round-info">

          ${
            currentLanguage === 'zh'

            ?

            `第 ${event.currentRound}
             輪 / 共
             ${event.totalRounds}
             輪`

            :

            `Round
             ${event.currentRound}
             /
             ${event.totalRounds}`
          }

        </div>

<div
  class="status"
  style="
  background:
  ${getStatusColor(event.status)}
  ">

  ${getStatusText(event.status)}

</div>

        <div class="progress">

          <div
            class="progress-fill"
            style="
              background:
              ${getStatusColor(
                event.status
              )};

              width:
              ${percent}%">

          </div>

        </div>

        <div class="progress-text">

          ${
            TXT[
              currentLanguage
            ].progress
          }

          :

          ${percent.toFixed(0)}%

        </div>

<div class="event-announcement">

    <span class="announcement-title">

        📢

    </span>

    <span class="announcement-content">

        ${
          (
            currentLanguage === 'zh'
              ? event.announcementZh
              : event.announcementEn
          ) || '-'
        }

    </span>

</div>

        ${renderDivisions(event)}

      </div>

    `;

  });

  document
    .getElementById(
      'eventsContainer'
    )
    .innerHTML = html;

}

function renderDivisions(event){

  if(
    !event.divisions ||
    !event.divisions.length
  ){

    return `

      <div class="no-schedule">

      ${
        TXT[
          currentLanguage
        ].noSchedule
      }

      </div>

    `;

  }

  let html =
    `<div class="divisions">`;

  event.divisions
    .forEach(division=>{

      const currentName =

        currentLanguage === 'zh'

        ?

        division.currentDivisionZh

        :

        division.currentDivisionEn;

      const nextName =

        currentLanguage === 'zh'

        ?

        division.nextDivisionZh

        :

        division.nextDivisionEn;

      html += `

      <div
        class="division-card"

        onclick="showSchedule(

          '${event.eventId}',

          '${division.group}'

        )">

        <div class="group-title">

          ${
            currentLanguage === 'zh'

            ?

            division.groupNameZh

            :

            division.groupNameEn
          }

        </div>

        <div class="section-label">

          ${
            TXT[
              currentLanguage
            ].current
          }

        </div>

        <div class="current-name">

          ${currentName}

        </div>

        <div class="division-code">

          (${division.currentCode})

        </div>

        <div class="arrow">

          ↓

        </div>        ${
          division.isFinalRound

          ?

          `

          <div class="section-label">

            ${
              TXT[
                currentLanguage
              ].next
            }

          </div>

          <div class="next-name">

            ${
              TXT[
                currentLanguage
              ].finalRound
            }

          </div>

          `

          :

          `

          <div class="section-label">

            ${
              TXT[
                currentLanguage
              ].next
            }

          </div>

          <div class="next-name">

            ${nextName}

          </div>

          <div class="division-code">

            (${division.nextCode})

          </div>

          `

        }

      </div>

      `;

    });

  html += '</div>';

  return html;

}

function showSchedule(
  eventId,
  group
){

  const event =
    boardData.events.find(
      e =>
        e.eventId === eventId
    );

  if(!event) return;

  const division =
    event.divisions.find(
      d =>
        d.group === group
    );

  if(!division) return;

  document
    .getElementById(
      'modalTitle'
    )
    .innerText =

      currentLanguage === 'zh'

      ?

      division.groupNameZh

      :

      division.groupNameEn;

  let html = '';

  const announcement =

    currentLanguage === 'zh'

    ?

    division.groupAnnouncementZh

    :

    division.groupAnnouncementEn;

  if(announcement){

html += `

<div class="schedule-announcement">

  <strong>📢 ${
      TXT[
        currentLanguage
      ].groupAnnouncement
  }</strong>

  <span>

    ${announcement}

  </span>

</div>

`;

  }

  html +=
    `<div class="schedule-table">`;

  division.rounds
    .forEach(r=>{

      let cls = '';

      let badge = '';

      if(
        r.round ===
        division.currentRoundNumber
      ){

        cls='current';

        badge =

        `<span
           class="
           badge
           badge-current">

         ${
          TXT[
            currentLanguage
          ].currentBadge
         }

         </span>`;

      }

      if(
        r.round ===
        division.nextRoundNumber
      ){

        cls='next';

        badge =

        `<span
           class="
           badge
           badge-next">

         ${
          TXT[
            currentLanguage
          ].nextBadge
         }

         </span>`;

      }

      html += `

        <div
         class="
         schedule-row
         ${cls}">

          <div
           class="round-label">

            R${r.round}

            ${badge}

          </div>

          <div>

            ${
              currentLanguage === 'zh'

              ?

              r.nameZh

              :

              r.nameEn
            }

          </div>

          <div
            class="division-code">

            (${r.code})

          </div>

        </div>

      `;

    });

  html += '</div>';

  document
    .getElementById(
      'modalBody'
    )
    .innerHTML = html;

  document
    .getElementById(
      'scheduleModal'
    )
    .classList.add(
      'show'
    );

}

function closeModal(){

  document
    .getElementById(
      'scheduleModal'
    )
    .classList.remove(
      'show'
    );

}

window.onclick =
function(e){

  if(
    e.target ===
    document.getElementById(
      'scheduleModal'
    )
  ){

    closeModal();

  }

};

loadData();

setInterval(
  loadData,
  10000
);

  </script>

</body>

</html>
