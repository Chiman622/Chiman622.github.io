<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Competition Board V2 Final</title><style>:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#f8fafc;--muted:#94a3b8;--running:#dc2626;--prep:#f59e0b;--blue:#2563eb}*{box-sizing:border-box;font-family:Segoe UI,Arial,sans-serif}body{margin:0;background:var(--bg);color:var(--text);padding:20px}.container{max-width:1800px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.lang button{padding:8px 12px}.events{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px}.progress{height:12px;background:#475569;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--running);width:0%}.status{display:inline-block;padding:6px 12px;border-radius:99px;color:white}.eventAnnouncement,.master{margin-top:15px;padding:12px;border-radius:10px}.eventAnnouncement{background:#1e40af}.master{background:var(--blue);font-weight:bold}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{padding:10px;text-align:center;border-bottom:1px solid #334155}th{background:#334155}.footer{text-align:center;color:var(--muted);margin-top:15px}@media(max-width:900px){.events{grid-template-columns:1fr}}</style></head><body><div class="container"><div class="top"><div><h1 id="competitionTitle">Loading...</h1><div id="subtitle"></div></div><div class="lang"><button onclick="setLanguage('zh')">中文</button><button onclick="setLanguage('en')">EN</button></div></div><div class="events"><div class="card"><h2 id="eventA-title"></h2><div id="eventA-round"></div><div id="eventA-status" class="status"></div><div class="progress"><div id="eventA-progress" class="fill"></div></div><div id="eventA-percent"></div><table><thead><tr><th id="g1">分組</th><th id="c1">現正進行</th><th id="n1">下一隊</th></tr></thead><tbody id="eventA-table"></tbody></table><div id="eventA-announcement" class="eventAnnouncement"></div></div><div class="card"><h2 id="eventB-title"></h2><div id="eventB-round"></div><div id="eventB-status" class="status"></div><div class="progress"><div id="eventB-progress" class="fill"></div></div><div id="eventB-percent"></div><table><thead><tr><th id="g2">分組</th><th id="c2">現正進行</th><th id="n2">下一隊</th></tr></thead><tbody id="eventB-table"></tbody></table><div id="eventB-announcement" class="eventAnnouncement"></div></div></div><div id="masterAnnouncement" class="master"></div><div id="lastUpdated" class="footer"></div></div><script>const API_URL='https://script.google.com/macros/s/AKfycbxrN97dEuVBaon8VTVQurxZYPDa49wAtdQt7gwdDWNizzCdYRCjD2XgbOZtwfOFMTch/exec';const TOTAL_ROUNDS=8;let currentLanguage=localStorage.getItem('language')||'zh';const TXT={zh:{group:'分組',current:'現正進行',next:'下一隊',updated:'最後更新時間：',progress:'完成進度'},en:{group:'Group',current:'Current',next:'Next',updated:'Last Updated: ',progress:'Progress'}};function setLanguage(l){currentLanguage=l;localStorage.setItem('language',l);applyLanguage();loadData()}function applyLanguage(){const t=TXT[currentLanguage];document.getElementById('g1').innerText=t.group;document.getElementById('g2').innerText=t.group;document.getElementById('c1').innerText=t.current;document.getElementById('c2').innerText=t.current;document.getElementById('n1').innerText=t.next;document.getElementById('n2').innerText=t.next;}function trStatus(s){if(currentLanguage==='en')return s;return {'In Progress':'進行中','Preparation':'準備中','Finished':'已完成','Break':'休息中'}[s]||s;}function render(prefix,e){document.getElementById(prefix+'-title').innerText=currentLanguage==='zh'?e.nameZh:e.nameEn;document.getElementById(prefix+'-round').innerText=currentLanguage==='zh'?`第 ${e.round} 輪 / 共 ${TOTAL_ROUNDS} 輪`:`Round ${e.round}/${TOTAL_ROUNDS}`;const st=document.getElementById(prefix+'-status');st.innerText=trStatus(e.status);st.style.background=e.status==='In Progress'?'#dc2626':'#f59e0b';const pct=(Number(e.round||0)/TOTAL_ROUNDS)*100;document.getElementById(prefix+'-progress').style.width=pct+'%';document.getElementById(prefix+'-percent').innerText=TXT[currentLanguage].progress+' '+pct.toFixed(1)+'%';document.getElementById(prefix+'-announcement').innerText='📢 '+(currentLanguage==='zh'?e.announcementZh:e.announcementEn);document.getElementById(prefix+'-table').innerHTML=(e.teams||[]).map(x=>`<tr><td>${x.group}</td><td>${x.current}</td><td>${x.next}</td></tr>`).join('');}async function loadData(){try{const r=await fetch(API_URL+'?t='+Date.now());const d=await r.json();document.getElementById('competitionTitle').innerText=currentLanguage==='zh'?d.competitionNameZh:d.competitionNameEn;document.getElementById('subtitle').innerText='32 Teams • 4 Groups • 8 Rounds';render('eventA',d.eventA);render('eventB',d.eventB);document.getElementById('masterAnnouncement').innerText='📢 '+(currentLanguage==='zh'?d.masterAnnouncementZh:d.masterAnnouncementEn);document.getElementById('lastUpdated').innerText=TXT[currentLanguage].updated+new Date().toLocaleString();}catch(err){document.getElementById('lastUpdated').innerText='Connection Error';}}applyLanguage();loadData();setInterval(loadData,5000);</script></body></html>
