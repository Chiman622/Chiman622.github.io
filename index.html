<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Competition Board V3.1 Light</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--border:#dbe4f0;--text:#1e293b;--muted:#64748b}
*{box-sizing:border-box;font-family:Segoe UI,Arial,sans-serif}
body{margin:0;padding:20px;background:var(--bg);color:var(--text)}
.container{max-width:1800px;margin:auto}
.header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:20px}
h1{margin:0}.lang button{padding:8px 12px;margin-left:4px}.events{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.status{display:inline-block;color:#fff;padding:8px 14px;border-radius:999px;font-weight:700}.progress{height:12px;background:#dbe4f0;border-radius:999px;overflow:hidden;margin:10px 0}.fill{height:100%;width:0}
.division-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:15px}
.division-card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:14px}
.group{color:#64748b;font-size:.9rem;margin-bottom:8px}.current-name{font-weight:700}.next-name{font-weight:700;color:#2563eb}.division-code{color:#64748b;font-size:.85rem}.arrow{text-align:center;color:#2563eb;margin:8px 0}
.event-announcement{background:#eef4ff;border-left:5px solid #2563eb;padding:12px;border-radius:10px;margin-top:15px}
.master-announcement{background:#2563eb;color:white;padding:18px;border-radius:16px;margin-top:20px;font-weight:700}.footer{text-align:center;color:#64748b;margin-top:15px}
@media(max-width:900px){.events{grid-template-columns:1fr}.division-grid{grid-template-columns:1fr}}
</style>
</head><body><div class="container"><div class="header"><h1 id="competitionTitle">Loading...</h1><div class="lang"><button onclick="setLanguage('zh')">中文</button><button onclick="setLanguage('en')">EN</button></div></div><div class="events"><div class="card"><h2 id="eventA-title"></h2><div id="eventA-round"></div><div id="eventA-status" class="status"></div><div class="progress"><div id="eventA-progress" class="fill"></div></div><div id="eventA-percent"></div><div id="eventA-divisions" class="division-grid"></div><div id="eventA-announcement" class="event-announcement"></div></div><div class="card"><h2 id="eventB-title"></h2><div id="eventB-round"></div><div id="eventB-status" class="status"></div><div class="progress"><div id="eventB-progress" class="fill"></div></div><div id="eventB-percent"></div><div id="eventB-divisions" class="division-grid"></div><div id="eventB-announcement" class="event-announcement"></div></div></div><div id="masterAnnouncement" class="master-announcement"></div><div id="lastUpdated" class="footer"></div></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbzUGbmYG4HSn1s0gojnYJ__LJKvHC8m6NTV21eXqhp01JmsqHRmKf-47oJWFl5-oo9b/exec'; const TOTAL_ROUNDS=8;
let currentLanguage=localStorage.getItem('language')||'zh';
const TXT={zh:{group:'組別',current:'現正進行',next:'下一個分區',progress:'完成進度',updated:'最後更新時間：'},en:{group:'Group',current:'Current',next:'Next Division',progress:'Progress',updated:'Last Updated: '}};
function setLanguage(l){currentLanguage=l;localStorage.setItem('language',l);loadData();}
function tStatus(s){if(currentLanguage==='en')return s; return {'Preparation':'準備中','Ready':'已就緒','In Progress':'進行中','Break':'休息中','Suspended':'暫停','Finished':'已完成'}[s]||s;}
function statusColor(s){return {'Preparation':'#f59e0b','Ready':'#2563eb','In Progress':'#dc2626','Break':'#6b7280','Suspended':'#7c3aed','Finished':'#16a34a'}[s]||'#6b7280';}
function renderDivisions(id, divisions){let html='';(divisions||[]).forEach(d=>{let c=currentLanguage==='zh'?(d.currentDivisionZh||d.currentCode):(d.currentDivisionEn||d.currentCode);let n=currentLanguage==='zh'?(d.nextDivisionZh||d.nextCode):(d.nextDivisionEn||d.nextCode);html+=`<div class="division-card"><div class="group">${TXT[currentLanguage].group} ${d.group}</div><div class="current-name">${c}<div class="division-code">(${d.currentCode})</div></div><div class="arrow">➜</div><div class="next-name">${n}<div class="division-code">(${d.nextCode})</div></div></div>`});document.getElementById(id).innerHTML=html;}
function renderEvent(prefix,e){document.getElementById(prefix+'-title').innerText=currentLanguage==='zh'?e.nameZh:e.nameEn;document.getElementById(prefix+'-round').innerText=currentLanguage==='zh'?`第 ${e.round} 輪 / 共 ${TOTAL_ROUNDS} 輪`:`Round ${e.round}/${TOTAL_ROUNDS}`;let st=document.getElementById(prefix+'-status');st.innerText=tStatus(e.status);st.style.background=statusColor(e.status);let pct=((e.round||0)/TOTAL_ROUNDS)*100;document.getElementById(prefix+'-progress').style.width=pct+'%';document.getElementById(prefix+'-progress').style.background=statusColor(e.status);document.getElementById(prefix+'-percent').innerText=TXT[currentLanguage].progress+' '+pct.toFixed(1)+'%';document.getElementById(prefix+'-announcement').innerText='📢 '+(currentLanguage==='zh'?e.announcementZh:e.announcementEn);renderDivisions(prefix+'-divisions',e.divisions);}
async function loadData(){try{const r=await fetch(API_URL+'?t='+Date.now());const d=await r.json();competitionTitle.innerText=currentLanguage==='zh'?d.competitionNameZh:d.competitionNameEn;masterAnnouncement.innerText='📢 '+(currentLanguage==='zh'?d.masterAnnouncementZh:d.masterAnnouncementEn);renderEvent('eventA',d.eventA);renderEvent('eventB',d.eventB);lastUpdated.innerText=TXT[currentLanguage].updated+new Date().toLocaleString();}catch(err){lastUpdated.innerText='Connection Error';}}
loadData();setInterval(loadData,5000);
</script></body></html>
