<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Competition Board V3 Final</title><style>:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#f8fafc;--muted:#94a3b8}*{box-sizing:border-box;font-family:Segoe UI,Arial,sans-serif}body{margin:0;background:var(--bg);color:var(--text);padding:20px}.container{max-width:1800px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.lang button{padding:8px 12px}.events{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px}.status{display:inline-block;padding:8px 14px;border-radius:999px;color:#fff;font-weight:700}.progress{height:12px;background:#475569;border-radius:99px;overflow:hidden;margin:10px 0}.fill{height:100%;width:0;background:#dc2626}.division-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}.division-card{background:#162339;border:1px solid #334155;border-radius:12px;padding:14px}.group{color:#94a3b8;font-size:.9rem;margin-bottom:8px}.current-name,.next-name{font-weight:700}.next-name{color:#fbbf24}.division-code{font-size:.85rem;color:#94a3b8}.arrow{text-align:center;color:#fbbf24;padding:8px 0}.event-announcement,.master-announcement{margin-top:15px;padding:12px;border-radius:10px}.event-announcement{background:#1e40af}.master-announcement{background:#2563eb;font-weight:700}.footer{text-align:center;color:var(--muted);margin-top:15px}@media(max-width:900px){.events{grid-template-columns:1fr}.division-grid{grid-template-columns:1fr}}</style></head><body><div class="container"><div class="top"><div><h1 id="competitionTitle">Loading...</h1></div><div class="lang"><button onclick="setLanguage('zh')">中文</button><button onclick="setLanguage('en')">EN</button></div></div><div class="events"><div class="card"><h2 id="eventA-title"></h2><div id="eventA-round"></div><div id="eventA-status" class="status"></div><div class="progress"><div id="eventA-progress" class="fill"></div></div><div id="eventA-percent"></div><div id="eventA-divisions" class="division-grid"></div><div id="eventA-announcement" class="event-announcement"></div></div><div class="card"><h2 id="eventB-title"></h2><div id="eventB-round"></div><div id="eventB-status" class="status"></div><div class="progress"><div id="eventB-progress" class="fill"></div></div><div id="eventB-percent"></div><div id="eventB-divisions" class="division-grid"></div><div id="eventB-announcement" class="event-announcement"></div></div></div><div id="masterAnnouncement" class="master-announcement"></div><div id="lastUpdated" class="footer"></div></div><script>const API_URL='https://script.google.com/macros/s/AKfycbxrN97dEuVBaon8VTVQurxZYPDa49wAtdQt7gwdDWNizzCdYRCjD2XgbOZtwfOFMTch/exec';const TOTAL_ROUNDS=8;let currentLanguage=localStorage.getItem('language')||'zh';const TXT={zh:{group:'組別',updated:'最後更新時間：',progress:'完成進度',current:'現正進行',next:'下一個分區'},en:{group:'Group',updated:'Last Updated: ',progress:'Progress',current:'Current',next:'Next Division'}};function setLanguage(l){currentLanguage=l;localStorage.setItem('language',l);loadData()}function translateStatus(s){if(currentLanguage==='en')return s;return {'Preparation':'準備中','Ready':'已就緒','In Progress':'進行中','Break':'休息中','Suspended':'暫停','Finished':'已完成'}[s]||s}function statusColor(s){return {'Preparation':'#f59e0b','Ready':'#2563eb','In Progress':'#dc2626','Break':'#6b7280','Suspended':'#7c3aed','Finished':'#16a34a'}[s]||'#6b7280'}function renderDivisions(id,divisions){let html='';(divisions||[]).forEach(d=>{let c=currentLanguage==='zh'?d.currentDivisionZh:d.currentDivisionEn;let n=currentLanguage==='zh'?d.nextDivisionZh:d.nextDivisionEn;html+=`<div class="division-card"><div class="group">${TXT[currentLanguage].group} ${d.group}</div><div>${TXT[currentLanguage].current}</div><div class="current-name">${c}</div><div class="division-code">(${d.currentCode})</div><div class="arrow">➜</div><div>${TXT[currentLanguage].next}</div><div class="next-name">${n}</div><div class="division-code">(${d.nextCode})</div></div>`});document.getElementById(id).innerHTML=html;}function renderEvent(prefix,e){document.getElementById(prefix+'-title').innerText=currentLanguage==='zh'?e.nameZh:e.nameEn;document.getElementById(prefix+'-round').innerText=currentLanguage==='zh'?`第 ${e.round} 輪 / 共 ${TOTAL_ROUNDS} 輪`:`Round ${e.round}/${TOTAL_ROUNDS}`;let st=document.getElementById(prefix+'-status');st.innerText=translateStatus(e.status);st.style.background=statusColor(e.status);let pct=((e.round||0)/TOTAL_ROUNDS)*100;document.getElementById(prefix+'-progress').style.width=pct+'%';document.getElementById(prefix+'-percent').innerText=TXT[currentLanguage].progress+' '+pct.toFixed(1)+'%';document.getElementById(prefix+'-announcement').innerText='📢 '+(currentLanguage==='zh'?e.announcementZh:e.announcementEn);renderDivisions(prefix+'-divisions',e.divisions);}async function loadData(){try{let r=await fetch(API_URL+'?t='+Date.now());let d=await r.json();competitionTitle.innerText=currentLanguage==='zh'?d.competitionNameZh:d.competitionNameEn;masterAnnouncement.innerText='📢 '+(currentLanguage==='zh'?d.masterAnnouncementZh:d.masterAnnouncementEn);renderEvent('eventA',d.eventA);renderEvent('eventB',d.eventB);lastUpdated.innerText=TXT[currentLanguage].updated+new Date().toLocaleString();}catch(e){lastUpdated.innerText='Connection Error';}}loadData();setInterval(loadData,5000);</script></body></html>
