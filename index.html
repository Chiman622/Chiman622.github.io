<!DOCTYPE html>
<html lang="zh-HK">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Competition Board V4 Final Light</title>

  <style>
    :root {

      --bg: #f4f7fb;
      --card: #ffffff;
      --border: #dbe4f0;

      --text: #1e293b;
      --muted: #64748b;

      --primary: #2563eb;

      --prep: #f59e0b;
      --progress: #dc2626;
      --ready: #2563eb;
      --finished: #16a34a;

    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {

      font-family:
        "Segoe UI",
        "Microsoft JhengHei",
        sans-serif;

      background: var(--bg);

      color: var(--text);

      padding: 20px;

    }

    .container {

      max-width: 1800px;

      margin: auto;

    }

    .header {

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 20px;

      margin-bottom: 20px;

    }

    h1 {

      font-size: 2.4rem;

      font-weight: 800;

    }

    .lang-switch {

      display: flex;

      gap: 8px;

    }

    .lang-switch button {

      border: none;

      background: white;

      border: 1px solid var(--border);

      padding: 10px 16px;

      border-radius: 10px;

      cursor: pointer;

      font-weight: 600;

    }

    .master-announcement {

      background: #2563eb;

      color: white;

      padding: 18px;

      border-radius: 18px;

      margin-bottom: 20px;

      font-size: 1.1rem;

      font-weight: 700;

      white-space: pre-line;

    }

    .events-container {

      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(450px, 1fr));

      gap: 20px;

    }

    .event-card {

      background: var(--card);

      border: 1px solid var(--border);

      border-radius: 20px;

      padding: 20px;

      box-shadow:
        0 2px 10px rgba(0, 0, 0, .08);

    }

    .event-title {

      font-size: 1.7rem;

      font-weight: 800;

    }

    .event-subtitle {

      color: var(--muted);

      margin-bottom: 16px;

    }

    .round-info {

      font-weight: 700;

      margin-bottom: 12px;

    }

    .status {

      display: inline-block;

      color: white;

      padding: 8px 14px;

      border-radius: 999px;

      font-weight: 700;

    }

    .progress {

      margin-top: 14px;

      height: 14px;

      background: #dbe4f0;

      border-radius: 999px;

      overflow: hidden;

    }

    .progress-fill {

      height: 100%;

      width: 0%;

    }

    .progress-text {

      margin-top: 8px;

      font-weight: 600;

      color: var(--muted);

    }

    .event-announcement {

      margin-top: 18px;

      background: #eef4ff;

      border-left: 5px solid #2563eb;

      padding: 12px;

      border-radius: 10px;

      white-space: pre-line;

    }

    .divisions {

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 12px;

      margin-top: 16px;

    }

    .division-card {

      background: #f8fafc;

      border: 1px solid #e2e8f0;

      border-radius: 14px;

      padding: 14px;

      cursor: pointer;

      transition: .2s;

    }

    .division-card:hover {

      transform: translateY(-2px);

    }

    .group-title {

      color: var(--primary);

      font-weight: 800;

      margin-bottom: 12px;

    }

    .section-label {

      color: var(--muted);

      font-size: .85rem;

      margin-bottom: 4px;

    }

    .current-name {

      font-weight: 700;

    }

    .next-name {

      font-weight: 700;

      color: var(--primary);

    }

    .division-code {

      color: var(--muted);

      font-size: .9rem;

    }

    .arrow {

      margin: 10px 0;

      font-size: 1.4rem;

      color: var(--primary);

    }

    .no-schedule {

      margin-top: 20px;

      padding: 20px;

      border: 1px dashed #cbd5e1;

      border-radius: 12px;

      text-align: center;

      color: var(--muted);

    }

    .footer {

      text-align: center;

      color: var(--muted);

      margin-top: 20px;

    }


    .modal {

      display: none;

      position: fixed;

      inset: 0;

      background: rgba(0, 0, 0, .55);

      z-index: 9999;

      padding: 20px;

    }

    .modal.show {

      display: block;

    }

    .modal-content {

      background: white;

      max-width: 900px;

      margin: 20px auto;

      border-radius: 20px;

      padding: 24px;

      max-height: 90vh;

      overflow: auto;

    }

    .modal-header {

      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 16px;

    }

    .close-btn {

      border: none;

      background: #ef4444;

      color: white;

      width: 40px;

      height: 40px;

      border-radius: 10px;

      cursor: pointer;

      font-size: 1.2rem;

    }

    .schedule-announcement {

      background: #eef4ff;

      border-left: 5px solid var(--primary);

      border-radius: 10px;

      padding: 12px;

      margin-bottom: 20px;

      white-space: pre-line;

    }

    .schedule-table {

      display: grid;

      gap: 10px;

    }

    .schedule-row {

      border: 1px solid #e5e7eb;

      border-radius: 10px;

      padding: 12px;

    }

    .schedule-row.current {

      border: 2px solid #2563eb;

      background: #eef4ff;

    }

    .schedule-row.next {

      border: 2px solid #f59e0b;

      background: #fff7ed;

    }

    .round-label {

      font-weight: 700;

      margin-bottom: 4px;

    }

    .badge {

      display: inline-block;

      margin-left: 10px;

      font-size: .8rem;

      padding: 4px 8px;

      border-radius: 999px;

      color: white;

    }

    .badge-current {

      background: #2563eb;

    }

    .badge-next {

      background: #f59e0b;

    }

    @media(max-width:900px) {

      .divisions {

        grid-template-columns: 1fr;

      }

      .events-container {

        grid-template-columns: 1fr;

      }

    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">

      <div>

        <h1 id="title">

          Loading...

        </h1>

        <div id="subtitle"></div>

      </div>

      <div class="lang-switch">

        <button onclick="setLang('zh')">
        中文
      </button>

        <button onclick="setLang('en')">
        EN
      </button>

      </div>

    </div>

    <div id="masterAnnouncement" class="master-announcement">

    </div>

    <div id="eventsContainer" class="events-container">

    </div>

    <div id="lastUpdated" class="footer">

    </div>

  </div>

  <div id="scheduleModal" class="modal">

    <div class="modal-content">

      <div class="modal-header">

        <h2 id="modalTitle">
        </h2>

        <button
              class="close-btn"
              onclick="closeModal()">

              ✕

          </button>

      </div>

      <div id="modalBody">

      </div>

    </div>

  </div>

  <script>
    const API_URL =
'https://script.google.com/macros/s/AKfycbw2HTOiRVQhZ5CThh4-5if5Vbn35QAT6AE_GK5cB5Q/dev';

let currentLanguage =
    localStorage.getItem(
        'language'
    ) || 'zh';

let boardData = null;

const TXT = {

  zh:{

    current:'本輪',

    next:'下一輪',

    finalRound:

      '已完成最後一輪',

    progress:

      '完成進度',

    noSchedule:

      '尚未設定賽程',

    updated:

      '最後更新時間',

    eventAnnouncement:

      '活動公告',

    groupAnnouncement:

      '組別公告',

    currentBadge:

      '本輪',

    nextBadge:

      '下一輪'

  },

  en:{

    current:'Current Round',

    next:'Next Round',

    finalRound:

      'Final Round Completed',

    progress:

      'Progress',

    noSchedule:

      'Schedule Not Configured',

    updated:

      'Last Updated',

    eventAnnouncement:

      'Event Announcement',

    groupAnnouncement:

      'Group Announcement',

    currentBadge:

      'Current',

    nextBadge:

      'Next'

  }

};
function setLang(lang){

  currentLanguage = lang;

  localStorage.setItem(
    'language',
    lang
  );

  if(boardData){

    render(boardData);

  }

}

function getStatusColor(status){

  switch(status){

    case 'Preparation':
      return 'var(--prep)';

    case 'Ready':
      return 'var(--ready)';

    case 'In Progress':
      return 'var(--progress)';

    case 'Finished':
      return 'var(--finished)';

    default:
      return '#64748b';

  }

}

async function loadData(){

  try{

    const res =
      await fetch(
        API_URL +
        '?t=' +
        Date.now()
      );

    const data =
      await res.json();

    boardData = data;

    render(data);

  }
  catch(ex){

    console.error(ex);

    document
      .getElementById(
        'eventsContainer'
      )
      .innerHTML =

      `
      <div class="no-schedule">

      API Connection Error

      </div>
      `;

  }

}

function render(data){

  document
    .getElementById(
      'title'
    )
    .innerText =

    currentLanguage === 'zh'

    ? data.competitionNameZh

    : data.competitionNameEn;

  document
    .getElementById(
      'masterAnnouncement'
    )
    .innerText =

    '📢 ' +

    (
      currentLanguage === 'zh'

      ? data.masterAnnouncementZh

      : data.masterAnnouncementEn
    );

  renderEvents(
    data.events
  );

  document
    .getElementById(
      'lastUpdated'
    )
    .innerText =

      TXT[
        currentLanguage
      ].updated

      + ' : '

      + new Date()
          .toLocaleString();

}

function renderEvents(events){

  let html = '';

  events.forEach(event=>{

    const percent =

      (
        event.currentRound
        / event.totalRounds
      ) * 100;

    html += `

      <div class="event-card">

        <div class="event-title">

          ${
            currentLanguage === 'zh'
              ? event.nameZh
              : event.nameEn
          }

        </div>

        <div class="event-subtitle">

          ${
            currentLanguage === 'zh'
            ? event.nameEn
            : event.nameZh
          }

        </div>

        <div class="round-info">

          ${
            currentLanguage === 'zh'

            ?

            `第 ${event.currentRound}
             輪 / 共
             ${event.totalRounds}
             輪`

            :

            `Round
             ${event.currentRound}
             /
             ${event.totalRounds}`
          }

        </div>

        <div
          class="status"
          style="
          background:
          ${getStatusColor(event.status)}
          ">

          ${event.status}

        </div>

        <div class="progress">

          <div
            class="progress-fill"
            style="
              background:
              ${getStatusColor(
                event.status
              )};

              width:
              ${percent}%">

          </div>

        </div>

        <div class="progress-text">

          ${
            TXT[
              currentLanguage
            ].progress
          }

          :

          ${percent.toFixed(0)}%

        </div>

        <div
          class="event-announcement">

          <b>

          📢

          ${
            TXT[
              currentLanguage
            ].eventAnnouncement
          }

          </b>

          <br><br>

          ${
            currentLanguage === 'zh'

            ?

            (
              event.announcementZh
              || '-'
            )

            :

            (
              event.announcementEn
              || '-'
            )
          }

        </div>

        ${renderDivisions(event)}

      </div>

    `;

  });

  document
    .getElementById(
      'eventsContainer'
    )
    .innerHTML = html;

}

function renderDivisions(event){

  if(
    !event.divisions ||
    !event.divisions.length
  ){

    return `

      <div class="no-schedule">

      ${
        TXT[
          currentLanguage
        ].noSchedule
      }

      </div>

    `;

  }

  let html =
    `<div class="divisions">`;

  event.divisions
    .forEach(division=>{

      const currentName =

        currentLanguage === 'zh'

        ?

        division.currentDivisionZh

        :

        division.currentDivisionEn;

      const nextName =

        currentLanguage === 'zh'

        ?

        division.nextDivisionZh

        :

        division.nextDivisionEn;

      html += `

      <div
        class="division-card"

        onclick="showSchedule(

          '${event.eventId}',

          '${division.group}'

        )">

        <div class="group-title">

          ${
            currentLanguage === 'zh'

            ?

            division.groupNameZh

            :

            division.groupNameEn
          }

        </div>

        <div class="section-label">

          ${
            TXT[
              currentLanguage
            ].current
          }

        </div>

        <div class="current-name">

          ${currentName}

        </div>

        <div class="division-code">

          (${division.currentCode})

        </div>

        <div class="arrow">

          ↓

        </div>
